meta:
  version: v1.0.0
  name: lake_erie_dem
  hydromt_version: '>1.0a,<2'

# NGDC/NCEI "Bathymetry of Lake Erie and Lake Saint Clair" - 3 arc-second
# (~70 x 90 m) seamless topobathy, EPSG:4269, Float32, NoData -9999.
# Elevations are in meters relative to Lake Erie's Low Water Datum
# (173.5 m IGLD85), so the lake bed is negative and the shoreline is ~0.
# Downloaded by the notebook from
# https://www.ngdc.noaa.gov/mgg/greatlakes/erie/data/geotiff/erie_lld.geotiff.tar.gz
# The uri is relative to this file, so the whole example folder is copyable.
erie_lld:
  data_type: RasterDataset
  uri: downloads/dem/erie_lld.tif
  driver:
    name: rasterio
  metadata:
    category: topography
    crs: 4269
    source_url: https://www.ncei.noaa.gov/products/great-lakes-bathymetry
    notes: vertical datum is Lake Erie Low Water Datum (173.5 m IGLD85)
  data_adapter:
    rename:
      erie_lld: elevtn
